<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MotoAuto · Precios</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --brand:#E63329;--brand-dark:#B5211A;--brand-soft:#FEF2F1;
    --ink:#111;--ink-soft:#555;--ink-muted:#999;
    --bg:#F6F6F6;--card:#fff;--border:#E8E8E8;
    --radius:14px;--radius-sm:8px;
  }
  html,body{height:100%;background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}

  /* HEADER */
  header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);padding:12px 16px 10px}
  .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .logo-icon{width:36px;height:36px;background:var(--brand);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .logo-icon svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .logo-text{font-size:18px;font-weight:700;letter-spacing:-0.5px}
  .logo-text span{color:var(--brand)}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:6px}
  .tasa-badge{font-size:11px;color:var(--ink-muted);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:3px 9px;cursor:pointer;white-space:nowrap;transition:border-color .15s}
  .tasa-badge:active{border-color:var(--brand)}
  .refresh-btn{background:none;border:none;cursor:pointer;color:var(--ink-muted);padding:4px;border-radius:6px;display:flex;align-items:center}
  .refresh-btn:active{color:var(--brand)}
  .refresh-btn svg{width:16px;height:16px}
  .spinning{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* SEARCH */
  .search-wrap{position:relative}
  .search-wrap input{width:100%;height:42px;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:0 40px 0 14px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);outline:none;transition:border-color .15s}
  .search-wrap input:focus{border-color:var(--brand)}
  .search-wrap input::placeholder{color:var(--ink-muted)}
  .search-icon{position:absolute;right:13px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-muted)}
  .clear-btn{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ink-muted);display:none;font-size:20px;line-height:1;padding:2px}

  /* FILTERS */
  .filters{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .pill{flex-shrink:0;background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap;transition:all .15s;-webkit-tap-highlight-color:transparent}
  .pill.active{background:var(--brand);border-color:var(--brand);color:#fff}

  /* RESULTS INFO */
  .results-info{padding:10px 16px 4px;font-size:12px;color:var(--ink-muted)}

  /* LIST */
  .list{padding:0 12px 80px;display:flex;flex-direction:column;gap:8px}

  /* CARD */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:transform .1s;-webkit-tap-highlight-color:transparent}
  .card:active{transform:scale(.985)}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .card-name{font-size:14px;font-weight:600;line-height:1.35;flex:1;color:var(--ink)}
  .card-name mark{background:var(--brand-soft);color:var(--brand);border-radius:3px;padding:0 1px}
  .card-price{text-align:right;flex-shrink:0}
  .card-price .usd{font-size:17px;font-weight:700;color:var(--brand);line-height:1}
  .card-price .bs{font-size:11px;color:var(--ink-muted);margin-top:2px}
  .card-meta{margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}
  .badge-marca{background:#F0F0F0;color:#444}
  .badge-cat{background:var(--brand-soft);color:var(--brand)}
  .card-code{font-size:10px;color:var(--ink-muted);margin-left:auto}

  /* EMPTY / LOADING / ERROR */
  .state-box{text-align:center;padding:60px 24px;color:var(--ink-muted)}
  .state-box .icon{font-size:42px;margin-bottom:12px}
  .state-box p{font-size:14px;line-height:1.6}
  .state-box .retry{margin-top:16px;background:var(--brand);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}

  /* BOTTOM SHEET */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;z-index:101;border-radius:20px 20px 0 0;padding:0 0 env(safe-area-inset-bottom,20px);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:80vh;overflow-y:auto}
  .sheet.show{transform:translateY(0)}
  .sheet-handle{width:40px;height:4px;background:#E0E0E0;border-radius:2px;margin:14px auto 20px}
  .sheet-body{padding:0 20px 24px}
  .sheet-cat-badge{display:inline-flex;align-items:center;background:var(--brand-soft);color:var(--brand);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;margin-bottom:12px}
  .sheet-name{font-size:20px;font-weight:700;line-height:1.25;margin-bottom:4px}
  .sheet-marca{font-size:13px;color:var(--ink-muted);margin-bottom:20px}
  .sheet-prices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .price-box{background:var(--bg);border-radius:12px;padding:14px;text-align:center}
  .price-box .label{font-size:11px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .price-box .amount{font-size:24px;font-weight:700;color:var(--ink);line-height:1}
  .price-box.featured .amount{color:var(--brand)}
  .sheet-code{background:#F6F6F6;border-radius:var(--radius-sm);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
  .sheet-code .label{font-size:11px;color:var(--ink-muted);font-weight:600}
  .sheet-code .val{font-size:13px;font-weight:600;color:var(--ink)}

  /* TASA MODAL */
  .tasa-modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
  .tasa-modal.show{opacity:1;pointer-events:auto}
  .tasa-box{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:320px}
  .tasa-box h3{font-size:16px;font-weight:700;margin-bottom:6px}
  .tasa-box p{font-size:12px;color:var(--ink-muted);margin-bottom:16px;line-height:1.5}
  .tasa-box input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:22px;font-weight:700;font-family:inherit;outline:none;margin-bottom:14px;text-align:center}
  .tasa-box input:focus{border-color:var(--brand)}
  .tasa-actions{display:flex;gap:8px}
  .tasa-actions button{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
  .btn-cancel{background:#F0F0F0;color:var(--ink)}
  .btn-apply{background:var(--brand);color:#fff}
</style>
</head>
<body>

<header>
  <div class="logo-row">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2L3 7l9 5 9-5-9-5z"/><path d="M3 17l9 5 9-5"/><path d="M3 12l9 5 9-5"/></svg>
    </div>
    <div class="logo-text">Moto<span>Auto</span></div>
    <div class="header-right">
      <div class="tasa-badge" id="tasaBadge" onclick="openTasaEditor()">Bs <span id="tasaVal">…</span> ✎</div>
      <button class="refresh-btn" id="refreshBtn" onclick="loadData(true)" title="Actualizar productos">
        <svg id="refreshIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      </button>
    </div>
  </div>
  <div class="search-wrap">
    <input type="search" id="searchInput" placeholder="Buscar repuesto, código o marca…" autocomplete="off" autocorrect="off" spellcheck="false">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <button class="clear-btn" id="clearBtn">×</button>
  </div>
</header>

<div class="filters" id="filters">
  <div class="pill active" data-cat="TODOS">Todos</div>
  <div class="pill" data-cat="MOTO">Moto</div>
  <div class="pill" data-cat="CARRO">Carro</div>
  <div class="pill" data-cat="CAMION">Camión</div>
  <div class="pill" data-cat="LUBRICANTES Y FLUIDOS">Lubricantes</div>
  <div class="pill" data-cat="CONSUMIBLES">Consumibles</div>
</div>

<div class="results-info" id="resultsInfo"></div>
<div class="list" id="list"></div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="tasa-modal" id="tasaModal">
  <div class="tasa-box">
    <h3>Tasa del dólar</h3>
    <p>Ingresa la tasa BCV actual. Los precios en Bs se recalculan al instante y se guardan en el teléfono.</p>
    <input type="number" id="tasaInput" min="1" placeholder="1000">
    <div class="tasa-actions">
      <button class="btn-cancel" onclick="closeTasaEditor()">Cancelar</button>
      <button class="btn-apply" onclick="applyTasa()">Aplicar</button>
    </div>
  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRaAnGd-Bfaxo3LjUiGeV8p0F2weaKqHGwJ0hWibSMj02-h7dRAQPDMmGL5B8-XQg66Yjd3zgOAaz8X/pub?gid=2100998338&single=true&output=csv';

// Col indices (0-based): 0=Codigo, 1=Marca, 2=Producto, 3=Categoria, 4=Cant, 5=Costo, 6=desc, 7=CostoFinal, 8=Precio, 9=EN BS
// Row 0 has TASA in col 4, Row 1 is headers, Row 2+ is data

let PRODUCTS = [];
let currentTasa = parseFloat(localStorage.getItem('motoauto_tasa') || '1000');
let query = '';
let activeCat = 'TODOS';

// --- CSV PARSER ---
function parseCSV(text) {
  const lines = text.split(/\r?\n/);
  const result = [];
  for (let i = 0; i < lines.length; i++) {
    const row = [];
    let cur = '', inQ = false;
    for (let c = 0; c < lines[i].length; c++) {
      const ch = lines[i][c];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { row.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    row.push(cur.trim());
    result.push(row);
  }
  return result;
}

// --- LOAD DATA ---
async function loadData(force = false) {
  const icon = document.getElementById('refreshIcon');
  icon.classList.add('spinning');
  showLoading();

  // Cache in sessionStorage to avoid re-fetching on same session
  const cacheKey = 'motoauto_csv';
  let text = force ? null : sessionStorage.getItem(cacheKey);

  if (!text) {
    try {
      const res = await fetch(CSV_URL + '&t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      text = await res.text();
      sessionStorage.setItem(cacheKey, text);
    } catch (e) {
      icon.classList.remove('spinning');
      showError(e.message);
      return;
    }
  }

  const rows = parseCSV(text);
  // Row 0: tasa is in col 4
  const tasaFromSheet = parseFloat(rows[0]?.[4]);
  if (tasaFromSheet && !localStorage.getItem('motoauto_tasa')) {
    currentTasa = tasaFromSheet;
  }
  updateTasaBadge();

  // Row 1 = headers, Row 2+ = data
  PRODUCTS = [];
  for (let i = 2; i < rows.length; i++) {
    const r = rows[i];
    const prod = (r[2] || '').trim();
    if (!prod) continue;
    const precio = parseFloat(r[8]) || 0;
    PRODUCTS.push({
      codigo: (r[0] || '').trim(),
      marca:  (r[1] || '').trim(),
      producto: prod,
      categoria: (r[3] || '').trim().toUpperCase(),
      precio: precio,
      bs: precio ? Math.round(precio * currentTasa) : 0
    });
  }

  icon.classList.remove('spinning');
  search();
}

// --- TASA ---
function updateTasaBadge() {
  document.getElementById('tasaVal').textContent = currentTasa.toLocaleString('es-VE');
}
function openTasaEditor() {
  document.getElementById('tasaInput').value = currentTasa;
  document.getElementById('tasaModal').classList.add('show');
  setTimeout(() => document.getElementById('tasaInput').select(), 100);
}
function closeTasaEditor() {
  document.getElementById('tasaModal').classList.remove('show');
}
function applyTasa() {
  const val = parseFloat(document.getElementById('tasaInput').value);
  if (!val || val < 1) return;
  currentTasa = val;
  localStorage.setItem('motoauto_tasa', val);
  PRODUCTS.forEach(p => { p.bs = p.precio ? Math.round(p.precio * val) : 0 });
  updateTasaBadge();
  closeTasaEditor();
  render();
}

// --- SEARCH ---
function normalize(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function search() {
  const terms = normalize(query).split(/\s+/).filter(Boolean);
  const filtered = PRODUCTS.filter(p => {
    if (activeCat !== 'TODOS' && p.categoria !== activeCat) return false;
    if (!terms.length) return true;
    const hay = normalize(`${p.producto} ${p.marca} ${p.codigo}`);
    return terms.every(t => hay.includes(t));
  });
  render(filtered);
}

// --- RENDER ---
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function highlight(text, terms) {
  let s = escHtml(text);
  terms.forEach(t => {
    if (!t) return;
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
    s = s.replace(re, '<mark>$1</mark>');
  });
  return s;
}
function fmtUSD(n) { return n ? '$' + Number(n).toFixed(2) : '—' }
function fmtBS(n) { return n ? 'Bs ' + Math.round(n).toLocaleString('es-VE') : '—' }

function showLoading() {
  document.getElementById('resultsInfo').textContent = '';
  document.getElementById('list').innerHTML = `<div class="state-box"><div class="icon">⏳</div><p>Cargando productos desde<br>Google Sheets…</p></div>`;
}
function showError(msg) {
  document.getElementById('list').innerHTML = `<div class="state-box"><div class="icon">⚠️</div><p>No se pudo cargar la lista.<br><small>${escHtml(msg)}</small></p><button class="retry" onclick="loadData(true)">Reintentar</button></div>`;
}

function render(filtered) {
  if (!filtered) { search(); return; }
  const terms = normalize(query).split(/\s+/).filter(Boolean);
  const info = document.getElementById('resultsInfo');
  const list = document.getElementById('list');

  info.textContent = query || activeCat !== 'TODOS'
    ? `${filtered.length} resultado${filtered.length !== 1 ? 's' : ''}`
    : `${PRODUCTS.length} productos`;

  if (!filtered.length) {
    list.innerHTML = `<div class="state-box"><div class="icon">🔍</div><p>Sin resultados para <strong>"${escHtml(query)}"</strong>.<br>Intenta con otra palabra.</p></div>`;
    return;
  }

  const slice = filtered.slice(0, 150);
  list.innerHTML = slice.map(p => `
    <div class="card" onclick="openDetail(${PRODUCTS.indexOf(p)})">
      <div class="card-top">
        <div class="card-name">${highlight(p.producto, terms)}</div>
        <div class="card-price">
          <div class="usd">${fmtUSD(p.precio)}</div>
          <div class="bs">${fmtBS(p.bs)}</div>
        </div>
      </div>
      <div class="card-meta">
        ${p.marca ? `<span class="badge badge-marca">${escHtml(p.marca)}</span>` : ''}
        <span class="badge badge-cat">${escHtml(p.categoria)}</span>
        ${p.codigo ? `<span class="card-code">#${escHtml(p.codigo)}</span>` : ''}
      </div>
    </div>
  `).join('');

  if (filtered.length > 150) {
    list.innerHTML += `<div style="text-align:center;padding:16px;font-size:12px;color:#999">Mostrando 150 de ${filtered.length}. Afina la búsqueda.</div>`;
  }
}

// --- DETAIL ---
const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');

function openDetail(idx) {
  const p = PRODUCTS[idx];
  if (!p) return;
  document.getElementById('sheetBody').innerHTML = `
    <div class="sheet-cat-badge">${escHtml(p.categoria)}</div>
    <div class="sheet-name">${escHtml(p.producto)}</div>
    <div class="sheet-marca">${escHtml(p.marca) || '&nbsp;'}</div>
    <div class="sheet-prices">
      <div class="price-box featured">
        <div class="label">Dólares</div>
        <div class="amount">${fmtUSD(p.precio)}</div>
      </div>
      <div class="price-box">
        <div class="label">Bolívares</div>
        <div class="amount" style="font-size:${p.bs > 99999 ? '16px' : '22px'}">${fmtBS(p.bs)}</div>
      </div>
    </div>
    ${p.codigo ? `<div class="sheet-code"><span class="label">Código</span><span class="val">${escHtml(p.codigo)}</span></div>` : ''}
  `;
  overlay.classList.add('show');
  sheet.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeDetail() {
  overlay.classList.remove('show');
  sheet.classList.remove('show');
  document.body.style.overflow = '';
}
overlay.addEventListener('click', closeDetail);
let startY = 0;
sheet.addEventListener('touchstart', e => { startY = e.touches[0].clientY }, { passive: true });
sheet.addEventListener('touchend', e => { if (e.changedTouches[0].clientY - startY > 80) closeDetail() }, { passive: true });

// --- CONTROLS ---
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
searchInput.addEventListener('input', () => {
  query = searchInput.value;
  clearBtn.style.display = query ? 'block' : 'none';
  document.querySelector('.search-icon').style.display = query ? 'none' : 'block';
  search();
});
clearBtn.addEventListener('click', () => {
  searchInput.value = ''; query = '';
  clearBtn.style.display = 'none';
  document.querySelector('.search-icon').style.display = 'block';
  searchInput.focus();
  search();
});
document.getElementById('filters').addEventListener('click', e => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  activeCat = pill.dataset.cat;
  search();
});

// --- INIT ---
updateTasaBadge();
loadData();
</script>
</body>
</html>
